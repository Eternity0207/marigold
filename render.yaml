# Render Blueprint: deploys Marigold as a free static site.
# The cross-origin isolation headers let ONNX Runtime use every CPU thread.
services:
  - type: web
    name: marigold
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Serve the app at the bare domain; without this "/" can 404 while
    # "/index.html" works, and the service worker can't precache "./".
    routes:
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /sw.js
        name: Cache-Control
        value: no-cache
